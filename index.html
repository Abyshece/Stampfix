<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Stampfix | Digital Loyalty Cards for Apple &amp; Google Wallet</title>
    <meta name="description" content="Create a digital punch card for your business in 30 seconds. No app to download — your customers' loyalty cards live right in Apple Wallet and Google Wallet." />
    <meta name="theme-color" content="#37352F" />
    <link rel="canonical" href="https://stampfix.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Trustpilot -->
    <script type="text/javascript" src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>

    <!-- Open Graph (Facebook, WhatsApp, iMessage, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stampfix" />
    <meta property="og:title" content="Stampfix | Digital Loyalty Cards for Apple & Google Wallet" />
    <meta property="og:description" content="Create a digital punch card for your business in 30 seconds. No app to download — your customers' loyalty cards live right in Apple Wallet and Google Wallet." />
    <meta property="og:url" content="https://stampfix.app" />
    <meta property="og:image" content="https://stampfix.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stampfix | Digital Loyalty Cards in Google Wallet" />
    <meta name="twitter:description" content="Create a digital punch card for your business in 30 seconds. No app to download." />
    <meta name="twitter:image" content="https://stampfix.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Stampfix",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "url": "https://stampfix.app",
        "description": "Digital loyalty stamp cards for small businesses. Customers save their card to Apple Wallet or Google Wallet with no app to download, and collect stamps toward a reward.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "publisher": { "@type": "Organization", "name": "Stampfix", "url": "https://stampfix.app" }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts are self-hosted via @fontsource (imported in src/index.tsx) so no visitor IP is sent to Google. Avoids the German Google-Fonts Abmahnung risk. -->
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #37352F;
        background-color: #FFFFFF;
      }
      .font-serif-display {
        font-family: 'Lora', serif;
        font-optical-sizing: auto; /* let the face adapt its shape to size */
      }
      .notion-bg { background-color: #F7F7F5; }
      .notion-border { border-color: #E9E9E7; }
      .notion-hover:hover { background-color: #EFEFEE; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* --- Apple fluid-interface foundations (applies app-wide) --- */

      /* Kill input latency: remove the ~300ms tap delay + grey tap flash on
         everything interactive, so feedback can be instant on pointer-down. */
      button, a, [role="button"], summary, label[for],
      input[type="submit"], input[type="button"] {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      /* Respond on press, not on release. Buttons that don't already define
         their own :active transform get an instant, tactile scale-in.
         Springy easing keeps the settle natural rather than linear. */
      button, [role="button"] {
        transition: transform 140ms cubic-bezier(0.2, 0, 0, 1);
      }
      button:active, [role="button"]:active {
        transform: scale(0.97);
      }

      /* Reduced motion: swap slides/springs for gentle cross-fades and drop
         transforms — comprehension-preserving, vestibular-safe (Apple §14). */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 120ms !important;
          scroll-behavior: auto !important;
        }
        button:active, [role="button"]:active { transform: none; }
      }

      /* Reduced transparency: make the frosted chrome solid & legible. */
      @media (prefers-reduced-transparency: reduce) {
        .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg {
          -webkit-backdrop-filter: none !important;
          backdrop-filter: none !important;
          background-color: #FFFFFF !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
