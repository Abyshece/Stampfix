<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stampfix Phone</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="bar">
    <button id="back" type="button" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button id="home" type="button" title="Messages" aria-label="Messages">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span>Messages</span>
    </button>
    <button id="tab" type="button" title="Open this in a normal Chrome tab" aria-label="Open in a tab">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
    <button id="details" class="quiet" type="button" title="What the phone loaded">Details</button>
  </div>
  <ol id="log" class="log" hidden></ol>
  <div class="phone">
    <div class="island" aria-hidden="true"></div>
    <div class="screen">
      <iframe id="ig" title="Instagram" allow="clipboard-write; clipboard-read; autoplay; fullscreen"></iframe>
      <div id="login" class="login" hidden>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><path d="M17.5 6.5h.01"/></svg>
        </div>
        <h1>Log in to Instagram</h1>
        <p>Log in once in a normal Chrome tab. The phone uses that login and opens the chat by itself.</p>
        <button id="login-tab" class="primary" type="button">Log in to Instagram</button>
        <button id="login-here" class="link" type="button">or log in here in the phone</button>
      </div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
