<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stampfix Phone</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="bar">
    <button id="back" type="button" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button id="home" type="button" title="Messages" aria-label="Messages">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span>Messages</span>
    </button>
    <span class="name">Stampfix Phone</span>
  </div>
  <div class="phone">
    <div class="island" aria-hidden="true"></div>
    <iframe id="ig" title="Instagram" allow="clipboard-write; clipboard-read; autoplay; fullscreen"></iframe>
  </div>
  <script src="panel.js"></script>
</body>
</html>
